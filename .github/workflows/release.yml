name: Release

# Push a tag like v1.0.1 to publish a release with the card attached.
# The tag must match CARD_VERSION in trv-schedule-card.js.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE=$(grep -oP 'const CARD_VERSION = "\K[^"]+' trv-schedule-card.js)
          echo "Tag: $TAG  File: $FILE"
          test "$TAG" = "$FILE"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test
        run: |
          npm install
          npm test

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: trv-schedule-card.js
          generate_release_notes: true
